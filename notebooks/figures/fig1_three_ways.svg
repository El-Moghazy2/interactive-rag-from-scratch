<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" font-family="Helvetica, Arial, sans-serif"><rect x="0.5" y="0.5" width="959" height="339" rx="10" fill="#FCFBF7" stroke="#E6E1D3"/><rect x="20.0" y="20.0" width="294.0" height="300.0" rx="8" fill="#FFFFFF" stroke="#D9D4C5" stroke-width="1.2"/><text x="36.0" y="50.0" font-size="15.5" text-anchor="start" font-weight="bold" fill="#1F2933">(a) The model alone</text><text x="36.0" y="69.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#667085" font-style="italic">a closed-book exam</text><rect x="36.0" y="152.0" width="74.0" height="40.0" rx="6" fill="#FFFFFF" stroke="#98A2B3" stroke-width="1.2"/><text x="73.0" y="177.0" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1F2933">Question</text><polyline points="110.0,172.0 134.0,172.0" fill="none" stroke="#1F2933" stroke-width="1.5" stroke-linejoin="round"/><polygon points="142.0,172.0 134.0,168.4 134.0,175.6" fill="#1F2933"/><rect x="142.0" y="152.0" width="64.0" height="40.0" rx="6" fill="#F1F0EC" stroke="#1F2933" stroke-width="1.6"/><text x="174.0" y="177.0" font-size="13.5" text-anchor="middle" font-weight="bold" fill="#1F2933">LLM</text><polyline points="206.0,172.0 216.0,172.0" fill="none" stroke="#1F2933" stroke-width="1.5" stroke-linejoin="round"/><polygon points="224.0,172.0 216.0,168.4 216.0,175.6" fill="#1F2933"/><rect x="224.0" y="152.0" width="74.0" height="40.0" rx="6" fill="#FFFFFF" stroke="#98A2B3" stroke-width="1.2"/><text x="261.0" y="177.0" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1F2933">Answer</text><text x="174.0" y="112.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#667085" font-style="italic">only what it saw in training</text><polyline points="174.0,120.0 174.0,152.0" fill="none" stroke="#667085" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="3 3"/><polyline points="36.0,216.0 298.0,216.0" fill="none" stroke="#E6E1D3" stroke-width="1" stroke-linejoin="round"/><text x="38.0" y="244.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1B7F64">+  nothing to build</text><text x="38.0" y="268.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#B42318">–  has never seen your documents</text><text x="38.0" y="292.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#B42318">–  may invent a confident answer</text><rect x="333.0" y="20.0" width="294.0" height="300.0" rx="8" fill="#FFFFFF" stroke="#D9D4C5" stroke-width="1.2"/><text x="349.0" y="50.0" font-size="15.5" text-anchor="start" font-weight="bold" fill="#1F2933">(b) Fine-tuning</text><text x="349.0" y="69.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#667085" font-style="italic">study the book before the exam</text><rect x="349.0" y="152.0" width="74.0" height="40.0" rx="6" fill="#FFFFFF" stroke="#98A2B3" stroke-width="1.2"/><text x="386.0" y="177.0" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1F2933">Question</text><polyline points="423.0,172.0 447.0,172.0" fill="none" stroke="#1F2933" stroke-width="1.5" stroke-linejoin="round"/><polygon points="455.0,172.0 447.0,168.4 447.0,175.6" fill="#1F2933"/><rect x="455.0" y="152.0" width="64.0" height="40.0" rx="6" fill="#F1F0EC" stroke="#1F2933" stroke-width="1.6"/><text x="487.0" y="177.0" font-size="13.5" text-anchor="middle" font-weight="bold" fill="#1F2933">LLM</text><polyline points="519.0,172.0 529.0,172.0" fill="none" stroke="#1F2933" stroke-width="1.5" stroke-linejoin="round"/><polygon points="537.0,172.0 529.0,168.4 529.0,175.6" fill="#1F2933"/><rect x="537.0" y="152.0" width="74.0" height="40.0" rx="6" fill="#FFFFFF" stroke="#98A2B3" stroke-width="1.2"/><text x="574.0" y="177.0" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1F2933">Answer</text><rect x="347.0" y="88.0" width="88.0" height="32.0" rx="6" fill="#FFFFFF" stroke="#9B2C6F" stroke-width="1.2"/><text x="391.0" y="108.5" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#9B2C6F">Labelled data</text><polyline points="435.0,104.0 441.0,104.0" fill="none" stroke="#9B2C6F" stroke-width="1.5" stroke-linejoin="round"/><polygon points="447.0,104.0 441.0,101.3 441.0,106.7" fill="#9B2C6F"/><rect x="447.0" y="88.0" width="80.0" height="32.0" rx="6" fill="#FFFFFF" stroke="#9B2C6F" stroke-width="1.2"/><text x="487.0" y="108.5" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#9B2C6F">Training</text><polyline points="487.0,120.0 487.0,144.0" fill="none" stroke="#9B2C6F" stroke-width="1.5" stroke-linejoin="round"/><polygon points="487.0,152.0 490.6,144.0 483.4,144.0" fill="#9B2C6F"/><text x="495.0" y="140.0" font-size="10.5" text-anchor="start" font-weight="normal" fill="#9B2C6F" font-style="italic">new weights</text><polyline points="349.0,216.0 611.0,216.0" fill="none" stroke="#E6E1D3" stroke-width="1" stroke-linejoin="round"/><text x="351.0" y="244.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1B7F64">+  the knowledge is inside the model</text><text x="351.0" y="268.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#B42318">–  needs labelled data and GPU time</text><text x="351.0" y="292.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#B42318">–  train again when a rule changes</text><rect x="646.0" y="20.0" width="294.0" height="300.0" rx="8" fill="#FFFFFF" stroke="#D9D4C5" stroke-width="1.2"/><text x="662.0" y="50.0" font-size="15.5" text-anchor="start" font-weight="bold" fill="#1F2933">(c) RAG</text><text x="662.0" y="69.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#667085" font-style="italic">an open-book exam</text><rect x="662.0" y="152.0" width="74.0" height="40.0" rx="6" fill="#FFFFFF" stroke="#98A2B3" stroke-width="1.2"/><text x="699.0" y="177.0" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1F2933">Question</text><polyline points="736.0,172.0 760.0,172.0" fill="no