="272.0" width="250.0" height="36.0" rx="6" fill="#FFFFFF" stroke="#98A2B3" stroke-width="1.1"/><circle cx="330" cy="290" r="11" fill="#FFFFFF" stroke="#98A2B3"/><text x="330.0" y="294.5" font-size="12" text-anchor="middle" font-weight="bold" fill="#667085">5</text><text x="350.0" y="295.0" font-size="12.5" text-anchor="start" font-weight="bold" fill="#1F2933" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace">c36</text><text x="386.0" y="295.0" font-size="12" text-anchor="start" font-weight="normal" fill="#667085">Merit scholarship</text><text x="630.0" y="66.0" font-size="13" text-anchor="start" font-weight="bold" fill="#1F2933">Fused ranking</text><text x="630.0" y="83.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#667085">points = sum of 1 / (60 + rank)</text><rect x="630.0" y="96.0" width="306.0" height="60.0" rx="6" fill="#DFF3EC" stroke="#1B7F64" stroke-width="1.6"/><text x="644.0" y="121.0" font-size="13.5" text-anchor="start" font-weight="bold" fill="#1B7F64" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace">1.  c11</text><text x="712.0" y="121.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1F2933">CS-240 Databases</text><text x="644.0" y="142.0" font-size="12" text-anchor="start" font-weight="normal" fill="#1B7F64" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace">1/(60+2) + 1/(60+1) = 0.033</text><rect x="630.0" y="168.0" width="306.0" height="60.0" rx="6" fill="#E4EEF9" stroke="#2B6CB0" stroke-width="1.6"/><text x="644.0" y="193.0" font-size="13.5" text-anchor="start" font-weight="bold" fill="#2B6CB0" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace">2.  c02</text><text x="712.0" y="193.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1F2933">Semesters</text><text x="644.0" y="214.0" font-size="12" text-anchor="start" font-weight="normal" fill="#2B6CB0" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace">1/(60+4) + 1/(60+2) = 0.032</text><rect x="630.0" y="240.0" width="306.0" height="60.0" rx="6" fill="#FCEFD6" stroke="#B26A00" stroke-width="1.6"/><text x="644.0" y="265.0" font-size="13.5" text-anchor="start" font-weight="bold" fill="#B26A00" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace">3.  c10</text><text x="712.0" y="265.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1F2933">CS-204 Data Structures…</text><text x="644.0" y="286.0" font-size="12" text-anchor="start" font-weight="normal" fill="#B26A00" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace">1/(60+1) = 0.016</text><polyline points="568.0,190.0 614.0,190.0" fill="none" stroke="#1B7F64" stroke-width="1.8" stroke-linejoin="round"/><polygon points="622.0,190.0 614.0,186.4 614.0,193.6" fill="#1B7F64"/><text x="30.0" y="338.0" font-size="12" text-anchor="start" font-weight="normal" fill="#667085" font-style="italic">A chunk that both searches like collects points twice, so it rises to the top. Raw scores are never compared.</text></svg>