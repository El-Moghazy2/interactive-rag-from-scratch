<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 397" width="960" height="397" font-family="Helvetica, Arial, sans-serif"><rect x="0.5" y="0.5" width="959" height="396" rx="10" fill="#FCFBF7" stroke="#E6E1D3"/><text x="30.0" y="34.0" font-size="13" text-anchor="start" font-weight="bold" fill="#1F2933">The prompt that build_prompt returns</text><text x="640.0" y="34.0" font-size="13" text-anchor="start" font-weight="bold" fill="#1F2933">What each part is for</text><rect x="30.0" y="48.0" width="580.0" height="327.0" rx="4" fill="#FFFFFF" stroke="#98A2B3" stroke-width="1.2"/><rect x="40.0" y="60.0" width="560.0" height="33.0" rx="4" fill="#F1F0EC" stroke="none" stroke-width="0"/><rect x="40.0" y="60.0" width="4.0" height="33.0" rx="0" fill="#667085" stroke="none" stroke-width="0"/><text x="54.0" y="81.0" font-size="12" text-anchor="start" font-weight="normal" fill="#1F2933" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace">You are a helpful assistant for Moghazy University students.</text><polyline points="600.0,76.5 640.0,76.5" fill="none" stroke="#667085" stroke-width="1.3" stroke-linejoin="round"/><circle cx="640" cy="76.5" r="3.5" fill="#667085"/><text x="652.0" y="74.5" font-size="13.5" text-anchor="start" font-weight="bold" fill="#667085">Role</text><text x="652.0" y="91.5" font-size="11.5" text-anchor="start" font-weight="normal" fill="#667085">who the model is</text><rect x="40.0" y="99.0" width="560.0" height="90.0" rx="4" fill="#FDECEA" stroke="none" stroke-width="0"/><rect x="40.0" y="99.0" width="4.0" height="90.0" rx="0" fill="#B42318" stroke="none" stroke-width="0"/><text x="54.0" y="120.0" font-size="12" text-anchor="start" font-weight="normal" fill="#1F2933" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace">Answer the question using ONLY the context below.</text><text x="54.0" y="139.0" font-size="12" text-anchor="start" font-weight="normal" fill="#1F2933" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace">If the answer is not in the context, say</text><text x="54.0" y="158.0" font-size="12" text-anchor="start" font-weight="normal" fill="#1F2933" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace">"I don't know based on the handbook."</text><text x="54.0" y="177.0" font-size="12" text-anchor="start" font-weight="normal" fill="#1F2933" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace">Cite the chunk ids you used in square brackets, like [c12].</text><polyline points="600.0,144.0 640.0,144.0" fill="none" stroke="#B42318" stroke-width="1.3" stroke-linejoin="round"/><circle cx="640" cy="144.0" r="3.5" fill="#B42318"/><text x="652.0" y="142.0" font-size="13.5" text-anchor="start" font-weight="bold" fill="#B42318">Rules</text><text x="652.0" y="159.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#667085">stay inside the context, admit a gap, show sources</text><rect x="40.0" y="195.0" width="560.0" height="90.0" rx="4" fill="#DFF3EC" stroke="none" stroke-width="0"/><rect x="40.0" y="195.0" width="4.0" height="90.0" rx="0" fill="#1B7F64" stroke="none" stroke-width="0"/><text x="54.0" y="216.0" font-size="12" text-anchor="start" font-weight="normal" fill="#1F2933" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace">Context:</text><text x="54.0" y="235.0" font-size="12" text-anchor="start" font-weight="normal" fill="#1F2933" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace">[c21] Absence from an exam. A student who misses an exam because of…</text><text x="54.0" y="254.0" font-size="12" text-anchor="start" font-weight="normal" fill="#1F2933" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace">[c47] Student ID card. The student ID card opens the library gates,…</text><text x="54.0" y="273.0" font-size="12" text-anchor="start" font-weight="normal" fill="#1F2933" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace">[c20] Resits. A student who does not pass a final assessment may…</text><polyline points="600.0,240.0 640.0,240.0" fill="none" stroke="#1B7F64" stroke-width="1.3" stroke-linejoin="round"/><circle cx="640" cy="240.0" r="3.5" fill="#1B7F64"/><text x="652.0" y="238.0" font-size="13.5" text-anchor="start" font-weight="bold" fill="#1B7F64">Context</text><text x="652.0" y="255.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#667085">the chunks RETRIEVAL found, each with its id</text><rect x="40.0" y="291.0" width="560.0" height="33.0" rx="4" fill="#E4EEF9" stroke="none" stroke-width="0"/><rect x="40.0" y="291.0" width="4.0" height="33.0" rx="0" fill="#2B6CB0" stroke="none" stroke-width="0"/><text x="54.0" y="312.0" font-size="12" text-anchor="start" font-weight="normal" fill="#1F2933" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace">Question: Can I retake an exam I failed?</text><polyline points="600.0,307.5 640.0,307.5" fill="none" stroke="#2B6CB0" stroke-width="1.3" stroke-linejoin="round"/><circle cx="640" cy="307.5" r="3.5" fill="#2B6CB0"/><text x="652.0" y="305.5" font-size="13.5" text-anchor="start" font-weight="bold" fill="#2B6CB0">Question</text><text x="652.0" y="322.5" font-size="11.5" text-anchor="start" font-weight="normal" fill="#667085">the student's own words, unchanged</text><rect x="40.0" y="330.0" width="560.0" height="33.0" rx="4" fill="#F8E4EF" stroke="none" stroke-width="0"/><rect x="40.0" y="330.0" width="4.0" height="33.0" rx="0" fill="#9B2C6F" stroke="none" stroke-width="0"/><text x="54.0" y="351.0" font-size="12" text-anchor="start" font-weight="normal" fill="#1F2933" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace">Answer:</text><polyline points="600.0,346.5 640.0,346.5" fill="none" stroke="#9B2C6F" stroke-width="1.3" stroke-linejoin="round"/><circle cx="640" cy="346.5" r="3.5" fill="#9B2C6F"/><text x="652.0" y="344.5" font-size="13.5" text-anchor="start" font-weight="bold" fill="#9B2C6F">Cue</text><text x="652.0" y="361.5" font-size="11.5" text-anchor="start" font-weight="normal" fill="#667085">GEN