ENERATION</text><rect x="390.0" y="352.0" width="180.0" height="60.0" rx="6" fill="#F1F0EC" stroke="#1F2933" stroke-width="1.6"/><text x="480.0" y="378.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#1F2933">Reference answer</text><text x="480.0" y="396.0" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#667085">written by a person</text><polyline points="560.0,68.0 500.0,104.0" fill="none" stroke="#9B2C6F" stroke-width="1.3" stroke-linejoin="round" stroke-dasharray="4 3"/><polyline points="760.0,68.0 820.0,104.0" fill="none" stroke="#9B2C6F" stroke-width="1.3" stroke-linejoin="round" stroke-dasharray="4 3"/><rect x="510.0" y="24.0" width="300.0" height="46.0" rx="23" fill="#F8E4EF" stroke="#9B2C6F" stroke-width="1.5"/><text x="660.0" y="44.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#9B2C6F">Faithfulness</text><text x="660.0" y="60.0" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1F2933">is every claim backed by the chunks?</text><polyline points="480.0,164.0 480.0,352.0" fill="none" stroke="#1B7F64" stroke-width="1.3" stroke-linejoin="round" stroke-dasharray="4 3"/><rect x="320.0" y="190.0" width="320.0" height="46.0" rx="23" fill="#DFF3EC" stroke="#1B7F64" stroke-width="1.5"/><text x="480.0" y="210.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#1B7F64">Context recall</text><text x="480.0" y="226.0" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1F2933">was everything the reference needs retrieved?</text><rect x="320.0" y="262.0" width="320.0" height="46.0" rx="23" fill="#DFF3EC" stroke="#1B7F64" stroke-width="1.5"/><text x="480.0" y="282.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#1B7F64">Context precision</text><text x="480.0" y="298.0" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1F2933">are the useful chunks ranked above the rest?</text><polyline points="830.0,164.0 570.0,372.0" fill="none" stroke="#9B2C6F" stroke-width="1.3" stroke-linejoin="round" stroke-dasharray="4 3"/><rect x="668.0" y="236.0" width="268.0" height="46.0" rx="23" fill="#F8E4EF" stroke="#9B2C6F" stroke-width="1.5"/><text x="802.0" y="256.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#9B2C6F">Answer accuracy</text><text x="802.0" y="272.0" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1F2933">does it agree with the reference?</text><rect x="40.0" y="330.0" width="250.0" height="82.0" rx="6" fill="#FFFFFF" stroke="#E6E1D3" stroke-width="1.2"/><rect x="54.0" y="346.0" width="16.0" height="16.0" rx="8" fill="#DFF3EC" stroke="#1B7F64" stroke-width="1.2"/><text x="80.0" y="359.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1F2933">low score: fix retrieval</text><rect x="54.0" y="378.0" width="16.0" height="16.0" rx="8" fill="#F8E4EF" stroke="#9B2C6F" stroke-width="1.2"/><text x="80.0" y="391.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1F2933">low score: fix the prompt or model</text><text x="40.0" y="318.0" font-size="12" text-anchor="start" font-weight="normal" fill="#667085" font-style="italic">Each score points at one part of the system</text></svg>