h="1.6"/><text x="320.0" y="270.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#FFFFFF">4</text><text x="354.0" y="262.0" font-size="13.5" text-anchor="start" font-weight="bold" fill="#1F2933">space</text><text x="354.0" y="278.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#667085">between words</text><text x="300.0" y="316.0" font-size="12" text-anchor="start" font-weight="normal" fill="#1F2933">Start with the biggest natural break.</text><text x="300.0" y="332.2" font-size="12" text-anchor="start" font-weight="normal" fill="#1F2933">Go one step down only for a piece</text><text x="300.0" y="348.4" font-size="12" text-anchor="start" font-weight="normal" fill="#1F2933">that is still too long.</text><polyline points="240.0,200.0 284.0,200.0" fill="none" stroke="#2B6CB0" stroke-width="1.5" stroke-linejoin="round"/><polygon points="292.0,200.0 284.0,196.4 284.0,203.6" fill="#2B6CB0"/><polyline points="568.0,200.0 624.0,200.0" fill="none" stroke="#2B6CB0" stroke-width="1.5" stroke-linejoin="round"/><polygon points="632.0,200.0 624.0,196.4 624.0,203.6" fill="#2B6CB0"/><rect x="640.0" y="48.0" width="296.0" height="72.0" rx="6" fill="#E4EEF9" stroke="#2B6CB0" stroke-width="1.4"/><text x="652.0" y="68.0" font-size="12.5" text-anchor="start" font-weight="bold" fill="#2B6CB0" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace">c19</text><text x="924.0" y="68.0" font-size="11" text-anchor="end" font-weight="normal" fill="#667085">250 characters</text><text x="652.0" y="88.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1F2933">Exam conduct. Students must bring their</text><text x="652.0" y="104.0" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1F2933">university ID card to every exam. Doors…</text><rect x="640.0" y="132.0" width="296.0" height="72.0" rx="6" fill="#DFF3EC" stroke="#1B7F64" stroke-width="1.4"/><text x="652.0" y="152.0" font-size="12.5" text-anchor="start" font-weight="bold" fil